interface:
  display_name: "Manuscript peer review"
  short_description: "Simulate the referee reports a journal would send"
  default_prompt: "Use $manuscript-peer-review to simulate submitting this draft to our target journal before we submit it. Give us the three referees' reports as the journal would send them, each with its recommendation, strengths, and major and minor concerns that quote the manuscript; then our list of what to fix, ordered by when we can act on it, separating what we can fix in the text from what needs new analysis."
