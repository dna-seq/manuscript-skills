  # Read 2026-10-15; sources and verbatim quotes: journal-policies/elsevier.md

  elsevier:
    kind: publisher
    name: Elsevier journals (publisher default)
    publisher: Elsevier
    status: VERIFIED
    url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
    ai_policy_url: https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
    sources:
    - https://www.elsevier.com/connect/updated-generative-ai-policies-for-journals-supporting-responsible-use-while-protecting-trust
    writing_help: disclose
    exempt:
    - basic grammar
    - spelling and punctuation checks
    - basic reference-manager functions
    - AI features of disability assistive technology used only for accessibility
    disclosure_places:
    - separate declaration section immediately before the references (published)
    - Methods (AI in the research process or to write or edit code)
    disclosure_fields: [tool, model, purpose, extent, author oversight]
    prompts: on_request
    screening: integrity_signals
    screening_note: Elsevier teams use AI tools for technical checks and "research integrity checks"; editors' AI tools
      detect duplicate submissions; no AI-text detector named
    penalties: [fabricated references may lead to rejection]
    extra_burden: [AI-written or AI-edited code declared in detail in Methods]
    tracking: recommended
    disclosure_neutral: null
    reviewer_ai: banned
    image_rules:
    - AI-assisted explanatory images named in the caption
    - no general-purpose gen-AI graphical abstracts
    - AI cover art only with prior editor and publisher permission
    - no AI creation or alteration of primary research images
    limits: null
    fit_note: 'authors keep a record of tool, model and use (logs, prompts, outputs, tracked changes) and provide it if
      editors ask (tracking: recommended, prompts: on_request)'

  cell-press:
    kind: publisher
    name: Cell Press journals (publisher default)
    publisher: Cell Press / Elsevier
    status: VERIFIED
    url: https://www.cell.com/cell/information-for-authors/journal-policies
    ai_policy_url: https://www.cell.com/cell/information-for-authors/journal-policies
    sources:
    - https://www.cell.com/cell/information-for-authors/revise-manuscript
    - https://www.cell.com/reviewers
    - https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals
    writing_help: disclose
    exempt: [grammar, spelling, reference tools]
    disclosure_places:
    - titled declaration after Declaration of interests (published)
    - methods or STAR Methods when AI is part of the research design or methods
    disclosure_fields:
    - tool
    - reason
    - model or tool + version + developer or manufacturer for research use and data visualizations
    prompts: on_request
    screening: integrity_signals
    screening_note: Crossref Similarity Check, screening against a Cell Press cross-journal database, image screening of
      all accepted manuscripts; no AI-text detector named
    penalties: [fabricated references may lead to rejection (Elsevier policy)]
    extra_burden: []
    tracking: recommended
    disclosure_neutral: null
    reviewer_ai: banned
    image_rules:
    - AI-assisted explanatory images named in the figure legend
    - no AI-generated cover art unless AI is integral to the research
    - no general-purpose gen-AI graphical abstracts
    - no AI creation or alteration of research or data images (incl. brightness, contrast, colour)
    limits: null
    fit_note: AI text word-identical on the journal-policies pages of Cell, Cell Metabolism, Cell Systems, Cell Reports,
      Cell Reports Methods, Patterns, Cell Genomics and iScience (diffed 2026-10-15). Partner AJHG and HGG Advances, and
      Trends in Genetics, print the older 'readability and language only' text.

