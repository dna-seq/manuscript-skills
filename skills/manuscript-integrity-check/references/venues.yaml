  # ------------------------------------------------------------------ preprint servers (kind: preprint)
  # Ranked apart from journals (venues.py rank --preprints). Sources and quotes: venues-and-preprints.md §1-2.

  arxiv:
    kind: preprint
    name: arXiv
    publisher: Cornell University
    status: VERIFIED
    url: https://info.arxiv.org/help/submit/index.html
    ai_policy_url: https://info.arxiv.org/help/moderation/index.html
    sources:
      - https://blog.arxiv.org/2026/10/01/updated-rate-limit-policy/
      - https://blog.arxiv.org/2025/10/31/attention-authors-updated-practice-for-review-articles-and-position-papers-in-arxiv-cs-category/
      - https://blog.arxiv.org/2026/01/21/attention-authors-updated-endorsement-policy/
    fields: [general, bioinformatics, genomics, systems-biology, software]
    article_types: [research, methods, software, review, perspective]
    oa: full
    writing_help: disclose
    exempt: [use that is not "significant"]
    disclosure_places: [in the work, as for other methodology]
    disclosure_fields: [significant use of text-to-text generative AI]
    prompts: "no"
    screening: integrity_signals
    screening_note: >-
      volunteer moderators, not peer review; the 1 Oct 2026 post reports "a marked increase in dense, AI-written
      papers"; a one-year ban for "incontrovertible evidence that the authors did not check the results of LLM
      generation" (hallucinated references, chatbot meta-comments) was reported in May 2026 (404 Media,
      TechCrunch, Nature) but is on no arXiv policy page (SECONDARY)
    penalties: [declined for lacking originality, novelty or significance, closer scrutiny after a decline,
                may be required to publish in conventional journals first, one-year ban for unchecked LLM output (SECONDARY)]
    extra_burden: []
    other_desk_rules: [at most 2 submissions per calendar month and 3 active per submitter; rejected ones count,
                       CS review and position papers need a peer-reviewed version (journal ref and DOI),
                       a full English version is required, new submitters need an endorsement (institutional email alone no longer suffices)]
    fit_note: q-bio and cs categories fit methods and software papers; the CS review/position rule does not apply to research papers

  biorxiv:
    kind: preprint
    name: bioRxiv
    publisher: openRxiv
    status: VERIFIED
    url: https://www.biorxiv.org/about/FAQ
    ai_policy_url: https://www.biorxiv.org/about/FAQ
    sources: [https://openrxiv.org/trust-signals-and-accountability/]
    fields: [general, bioinformatics, genomics, genetics, systems-biology, aging]
    article_types: [research, methods, data]
    oa: full
    writing_help: disclose
    exempt: []
    disclosure_places: [in the manuscript, as for other computational methods]
    disclosure_fields: [use of generative AI tools]
    prompts: "no"
    screening: plagiarism
    screening_note: >-
      screened "for plagiarism, non-scientific content, inappropriate article types"; "extra scrutiny" after
      problematic prior submissions; no AI-text detection or reference check stated; AI review services (q.e.d.,
      Reviewer3, Explore Science) are opt-in feedback, not screening. No exemption for language editing is stated.
    penalties: [not posted (out of scope), formal withdrawal with a public statement in extreme cases]
    extra_burden: []
    other_desk_rules: [no narrative reviews, no announcements of tools or services without data, no hypotheses without new data,
                       no editorials, letters, opinion pieces, white papers or policy statements]
    software_article: false
    fit_note: a software paper must read as a research article with results, not a tool announcement

  medrxiv:
    kind: preprint
