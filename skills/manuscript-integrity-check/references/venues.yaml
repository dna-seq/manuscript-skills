    inherits: biorxiv
    url: https://www.medrxiv.org/about/FAQ
    ai_policy_url: https://www.medrxiv.org/about/FAQ
    fields: [clinical, genetics, aging]
    other_desk_rules: [simple automated or formulaic analyses of public data are generally not sufficient,
