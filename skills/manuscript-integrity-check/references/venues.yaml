    - grammar or structure
    disclosure_places: [at submission, Methods or Acknowledgements]
    disclosure_fields: [use of the tool, the content it generated]
    prompts: 'no'
    screening: plagiarism
    penalties:
    - rejection at any stage for inappropriate undisclosed use
    - joint Sage and editor investigation under COPE for published articles
    - reviewers who generate reports with GenAI are not invited again
    extra_burden: [AI-generated or AI-checked code disclosed]
    disclosure_neutral: true
    reviewer_ai: banned
