  # ------------------------------------------------------------------ Wiley, Taylor & Francis, Sage and Mary Ann Liebert, Karger
  # Read 2026-10-15; sources and verbatim quotes: journal-policies/wiley.md

  wiley:
    kind: publisher
    name: Wiley (publisher default)
    publisher: Wiley
    jif: null
    status: VERIFIED
    url: https://authorservices.wiley.com/ethics-guidelines/index.html
    ai_policy_url: https://www.wiley.com/en-gb/publish/article/ai-guidelines/
    sources:
    - https://newsroom.wiley.com/press-releases/press-release-details/2026/Wiley-Bolsters-Research-Integrity-Efforts-with-Imagetwins-Enhanced-Image-Screening/default.aspx
    writing_help: disclose
    exempt:
    - spelling
    - grammar and general editing
    - word choice and rephrasing awkward sentences
    - conciseness
    - formatting citations and references
    - code debugging
    - code style
    - code documentation
    - summaries read only for the author's own understanding
    disclosure_places:
    - at submission
    - Acknowledgments (drafting, editing, translation, formatting)
    - Methods (methodology, data collection or analysis, literature review, code development)
    disclosure_fields:
    - tool name and version
    - date or year of use
    - the tool's role
    - sections where used (recommended for Acknowledgments)
    - author's role in directing and reviewing the output
    - privacy compliance for sensitive or human-subject data (Methods)
    prompts: on_request
    screening: integrity_signals
    screening_note: Research Exchange uses AI to flag plagiarism, image manipulation and other integrity issues; Imagetwin
      image screening, which detects AI-generated image content, rolling out from life sciences (press release 26 May 2026);
      no AI-text detector named
    penalties:
    - disclosure requested during peer review or after publication if missing
    - fabricated citations may warrant rejection
    - editor decides whether a given AI use is permissible
    extra_burden:
    - AI-written analysis scripts, software pipelines or models disclosed in Methods with version and date
    - AI tools whose terms claim rights over or train on the submission may not be used
    tracking: recommended
    disclosure_neutral: true
    reviewer_ai: banned
    image_rules:
    - any AI-generated or AI-edited visual disclosed in the caption
    - no AI-edited photographs and no AI factual or evidential images
    limits: null
    fit_note: 'ethics page ''Last updated: July 2026''; the AI-guidelines page shows no date. Reviewers may use AI only
      on their own report text (organise, polish, translate), with disclosure to the editor'

  taylor-francis:
    kind: publisher
    name: Taylor & Francis (publisher default)
    publisher: Taylor & Francis
    jif: null
    status: VERIFIED
    url: https://taylorandfrancis.com/our-policies/ai-policy/
    ai_policy_url: https://authorservices.taylorandfrancis.com/editorial-policies/using-ai-in-your-research-and-manuscript-preparations/
    sources:
    - https://authorservices.taylorandfrancis.com/editorial-policies/defining-authorship-research-paper/
    writing_help: banned_drafting
    exempt: []
    disclosure_places:
    - Declaration of generative AI use in the article (required even when none was used)
    - Methods (AI in research methods or literature reviews)
    - submission-system confirmation
    disclosure_fields:
    - tool name with version
    - how used
    - reason for use
    - originality and accuracy confirmed by the authors
    - tool terms of use checked
    - authors take full responsibility including references
    prompts: on_request
    screening: plagiarism
    penalties: [editorial investigation, T&F retains discretion over publication]
    extra_burden:
    - original and AI-revised versions kept for the editor (copyediting, translation, plain-language summaries), with prompt
      records when AI is part of the method or a literature review
    tracking: required
    disclosure_neutral: false
    reviewer_ai: banned
    image_rules: [AI visuals disclosed in the figure legend]
    limits: null
    fit_note: the author-services AI page (modified 2026-08-26) bans AI first drafts of a manuscript or any section; individual
      journals may limit AI to language improvement; translation declarations name the author who checked the text

  sage:
    kind: publisher
    name: Sage (publisher default)
    publisher: Sage
    jif: null
    status: VERIFIED
    url: https://www.sagepub.com/journals/publication-ethics-policies/artificial-intelligence-policy
    ai_policy_url: https://www.sagepub.com/journals/publication-ethics-policies/artificial-intelligence-policy
