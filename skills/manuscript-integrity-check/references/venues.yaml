  # ------------------------------------------------------------------ Other journals where tracked aging and bioinformatics researchers publish
  # Read 2026-10-15; sources and verbatim quotes: journal-policies/peers.md

  bmj:
    kind: publisher
    name: BMJ Publishing Group (publisher default)
    publisher: BMJ
    status: VERIFIED
    url: https://authors.bmj.com/policies/ai-use/
    ai_policy_url: https://authors.bmj.com/policies/ai-use/
    oa: null
    writing_help: disclose_all
    exempt: []
    disclosure_places:
    - contributor section
    - Methods (fuller description if AI was used in the research)
    - supplementary files or information for the editor (optional summary of input and output)
    disclosure_fields:
    - what AI technology (name)
    - why it was used
    - how it was used (its task)
    - optional summary of input
    - output and how the authors reviewed the output
    prompts: encouraged
    screening: may_detect_ai
    screening_note: '"We may, on a systematic or case by case basis, use screening tools pre-publication to assist with
      the identification of content generated (in whole or in part) through AI technologies. We may also use such tools
      post-publication." iThenticate runs on submissions (BMJ Open page).'
    penalties:
    - rejection or post-publication changes for inadequate declaration or for the circumstances of use
    extra_burden:
    - disclosure also covers AI used in "any other work by the authors which underpins" the submission and in "any key
      sources which are cited"
    tracking: recommended
    disclosure_neutral: false
    reviewer_ai: restricted
    limits: null
    software_article: null
    fit_note: 'page dateModified 2026-05-21; policy says it is reviewed ''every six months until further notice''. No language-editing
      exemption: the policy covers ''all types of content'' and asks reviewers to declare even language help. disclosure_neutral
      false: ''Editors will consider the suitability of the use outlined''.'

  portland-press:
    kind: publisher
    name: Portland Press / Biochemical Society (publisher default)
    publisher: Portland Press (Biochemical Society)
    status: VERIFIED
    url: https://portlandpress.com/pages/editorial_policy
    ai_policy_url: https://portlandpress.com/pages/editorial_policy
    oa: null
    writing_help: disclose_all
    exempt: []
    disclosure_places: [Materials and Methods (or similar section)]
    disclosure_fields:
    - which AI tool
    - how it was used
    - for custom-written AI tools the algorithm and the training data or its source
    prompts: 'no'
    screening: plagiarism
    screening_note: '"All papers are screened for plagiarism using Similarity Check." No AI detector named.'
    penalties: []
    extra_burden: []
    disclosure_neutral: null
    reviewer_ai: banned
    image_rules:
    - no AI-generated images or videos ("Authors shall not use AI tools in generating images or videos for inclusion in
      their manuscript")
    limits: null
    other_desk_rules:
    - a custom-written AI tool must have its algorithm and training data (or their source) available to readers
    software_article: null
    fit_note: portlandpress.com sits behind a Cloudflare challenge that defeated headless Chrome, CDP and WebFetch (403);
