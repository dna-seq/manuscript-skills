# Venue requirements that matter for AI policy, desk screening and manuscript structure.
# Read by manuscript-integrity-check/scripts/scan.py (--venue length limits) and by
# manuscript-journal-adapt/scripts/venues.py (rank, show).
#
# Every value comes from the venue's own pages as read on `checked` (sources and verbatim quotes:
# publisher-policies.md, target-journals.md, journal-policies/<publisher>.md). `null` means not
# researched, never "no rule". A `jif` with a `jif_year` was read on the journal's or publisher's own
# page; one without is a value circulating in mid-2026: confirm in Journal Citation Reports.
# policy_watch.py re-reads every url, ai_policy_url and sources entry; policy-snapshots/index.yaml holds
# the date each page was last read.
#
# Kinds and inheritance
#   kind:          absent for a journal; `publisher` for a default that journals inherit (never ranked);
#                  `preprint` for a preprint server (venues.py rank --preprints)
#   inherits:      the entry whose fields apply unless restated; a journal never inherits a publisher
#                  default's name, url, sources, JIF, fields or fit note
#
# Vocabularies
#   writing_help:  free             AI writing help needs no disclosure
#                  disclose         allowed; substantive help disclosed, language polish exempt
#                  disclose_all     allowed; even language editing must be disclosed
#                  red_line         allowed with disclosure, but AI-written results/discussion or
#                                   prompt-only content is forbidden (Springer Nature Red tier)
#                  banned_drafting  drafting from a prompt forbidden; only correction aids named (ISCB)
#   prompts:       no | on_request | encouraged | required
#   screening:     plagiarism | integrity_signals | may_detect_ai | ai_detector_deployed
#   extra_burden:  free-text items that cost the authors of AI-assisted text work beyond the disclosure
#                  (deposited outputs, AI-free replies to reviewers, the tool cited, labelled AI text); not
#                  repeats of prompts/tracking/writing_help, and not image rules
#   image_rules:   rules on AI-generated or AI-edited figures, cover art and graphical abstracts (shown by
#                  `venues.py show`, not scored)
#   disclosure_neutral: true if the page says a declared AI use does not count against the paper, false if
#                  it says it may weigh in the decision, null if silent
#   reviewer_ai:   banned | restricted (only publisher-approved tools) | allowed | null
#   fields:        aging, bioinformatics, genomics, genetics, systems-biology, clinical, general, data, software
#   article_types: research, methods, software, database, data, review, perspective, letter
#   oa:            full | hybrid | subscription
#   tracking:      required     the venue makes authors record AI use beyond one acknowledgement (prompts,
#                               deposited outputs, kept versions); venues.py rank leaves these out by default
#                  recommended  the policy says authors should keep records and may be asked for them
#
# Length limits and the page's own words (venues.py show prints the quotes; scan.py --venue reads `limits`)
#   limits:        abstract_words and body_words (words); over_limit_return, the multiple of the body limit
#                  past which the venue says it returns papers without review (1.2 = more than 20% over);
#                  abstract_words_kind: required (the default when absent) | recommended (the page recommends
#                  the length and allows some flexibility; scan.py says "recommends", not "asks for")
#   limit_quotes:  per limit, the sentences of the page it rests on, verbatim
#   submission_rules: rules of the author guidelines that venues.py show lists with the current-draft items,
#                  each {when, rule, quote}: when is `submission` (needed for the first submission) or
#                  `after_review` (needed only after the first review, such as a reference style); rule is in
#                  plain words; quote is the page's sentences, verbatim
#   quoted_from:   the copy of the page that limit_quotes and submission_rules quote, when it is not the live
#                  page read on `checked`: {source (an Internet Archive URL), copy_date (the capture), checked
#                  (when it was read), note (why that copy)}
#   limit_quotes, submission_rules and quoted_from describe one journal's page and are never inherited.
#
# Selection fields: validation_requirements, excluded_study_designs, open_science, editorial_profile,
# review_speed, publication_costs. See manuscript-journal-select/references/selection-fields.md.
# Each fact has its own source/read date. Missing fields are unknown; timing and editorial assessments
# are journal-specific and never inherited. Validation/resource fit is separate from AI friction.

checked: 2026-10-15

venues:
  bioinformatics:
    name: Bioinformatics (Original Paper)
    publisher: OUP / ISCB
    jif: 5.5
    jif_year: 2025
    status: VERIFIED
    url: https://academic.oup.com/bioinformatics/pages/author-guidelines
    ai_policy_url: https://transition.iscb.org/iscb-policy-statements/iscb-policy-for-acceptable-use-of-large-language-models
    fields: [bioinformatics, software]
    writing_help: banned_drafting
    exempt: null # permitted use does not by itself establish a disclosure exemption
    permitted_uses: [spelling and grammar checking, translation (author responsible), code-writing help, code documentation, LLM as research technique, LLM as evaluation (finding inconsistencies)]
    disclosure_places: [cover letter, Methods or Acknowledgements, supplementary materials]
    disclosure_fields: [tool, version, how used, which parts, author oversight]
    prompts: "no"
    screening: plagiarism
    screening_note: ISCB "does not intend to systematically detect usage"; investigates reported cases
    penalties: [rejection for non-disclosure (OUP), correction or retraction]
    extra_burden: [supplementary documentation of any LLM help that produced part of the content]
    oa: full # "Bioinformatics is a peer-reviewed fully open access journal" (quoted_from)
    # Original Papers "describe new research developments in computational molecular biology, for example: models,
    # algorithms, software involving new methods, biological databases and network information services"
    article_types: [research, methods, software, database]
    limits: {abstract_words: 150, abstract_words_kind: recommended, body_words: 5000, over_limit_return: 1.2}
    limit_quotes:
      abstract_words: ["A maximum of 150 words is recommended.", "In cases where authors feel the headings inappropriate, some flexibility is allowed."]
      body_words: ["Original papers: up to 7 pages, this is approx. 5000 words, not including figures,"]
      over_limit_return: ["The journal strongly discourages authors from exceeding stated page limits. Manuscripts exceeding the recommended limits may be rejected without review - for example manuscripts that exceed the limit by 20% or more are usually returned by the Editorial Office immediately."]
    quoted_from:
      source: https://web.archive.org/web/20260817204053/https://academic.oup.com/bioinformatics/pages/author-guidelines
      copy_date: 2026-08-17
      checked: 2026-10-19
      note: the live page could not be read past its open-access charges section on 2026-10-19, so its later sections were read on this copy
      # The catalogue's earlier over_limit_return: null ("the live page states no return rule") came from such a
      # cut-off reading; the rule is in the "Format-Free Submission" section of this copy.
    submission_rules:
      - when: submission
        rule: "the sections of an Original Paper in this order: Title page, Structured Abstract, Introduction, System and methods, Algorithm, Implementation, Discussion, References"
        quote: ["Please subdivide manuscripts into the following sequence of sections, according to the type of paper:", "Original papers: Title page, Structured Abstract, Introduction, System and methods, Algorithm, Implementation, Discussion, References."]
      - when: submission
        rule: alt text for every image and figure of the main article, in the manuscript file directly under its legend
        quote: ["When submitting your manuscript, we require you to provide alt text (alternative text) descriptions for all images, figures, illustrations, and photographs included in the main article.", "Please include each alt text description in your main manuscript file, directly under the figure legend for the relevant figure, preceded by ‘Alt text:’."]
      - when: submission
        rule: Supplementary Data submitted for review apart from the manuscript, with all its text, figures and tables in a single file, and referred to in the main text
        quote: ["Supplementary Data should be submitted for review, in a separate file or files from the manuscript. Authors should make sure that all additional text, figures and tables are presented in a single file.", "Authors should ensure that the Supplementary Data is referred to in the main manuscript at an appropriate point in the text."]
      - when: submission
        rule: the funding in a section titled Funding, first in the Acknowledgements, as a sentence that begins "This work was supported by", with the full agency names and the grant numbers in square brackets
        quote: ["Details of all funding sources for the work in question should be given in a separate section entitled 'Funding'. This should appear first in the 'Acknowledgements' section.", "The sentence should begin: ‘This work was supported by …’", "Grant numbers should be given in brackets as follows: ‘[grant number xxxx]’"]
      - when: submission
        rule: every public dataset cited in the reference list with its identifier, the citation beginning with the tag [dataset]
        quote: ["requires that all publicly available datasets be fully referenced in the reference list with an accession number or unique identifier such as a digital object identifier (DOI).", "[dataset]* Authors, Year, Title, Publisher (repository or archive name), Identifier"]
      - when: submission
        rule: a cover letter that explains why the paper suits the journal, and why the manuscript departs from the instructions wherever it does
        quote: ["All submissions must be accompanied by a cover letter explaining the suitability of the paper for", "Submissions omitting a cover letter may be editorially rejected.", "If the submitted manuscript deviates from the requirements listed in the Instructions to Authors, the reasons for this must be clearly explained."]
      - when: submission
        rule: a declaration, at the first submission, of any author or contributor who is the journal's Editor-in-Chief, an editor or an editorial board member
        quote: ["At initial submission, the corresponding author must declare if the Editor-in-Chief, an editor, or an editorial board member of the Journal is an author of or contributor to the manuscript."]
      - when: after_review
        rule: the reference style, Oxford SCIMED
        quote: ["The journal follows Oxford SCIMED style. Please refer to Oxford SCIMED requirements when preparing your manuscript after initial review."]
    abstract_headings: [Motivation, Results, Availability and Implementation, Contact, Supplementary Information]
    required_sections: [Data availability, Availability and Implementation (in the abstract)]
    software: [source at a stable URL at submission, "archived version (Zenodo, Software Heritage or Figshare) URL in the abstract", test data, install and run documentation, instructions to reproduce each figure]
    other_desk_rules: [ML papers validated by leave-one-out are editorially rejected, new methods compared with state of the art, pre-screen returns papers of less significance, all data on which the conclusions are based publicly available in stable public repositories (Supporting Data)]
    software_article: true

  bioinformatics-note:
    name: Bioinformatics (Application Note)
    inherits: bioinformatics
    # Application Notes "are short descriptions of novel software or new algorithm implementations, databases and
