    - Methods for AI used in the research process
    disclosure_fields: [tool name and version, purpose, extent of oversight, prompts where applicable]
    prompts: required
    screening: plagiarism
    screening_note: editors check material with CrossCheck (The Lancet - non-research items; LANHL and eBioMedicine - "at
