<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f1f0ec; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --accent-ink: #1c5cab; --focus: #2a78d6; --deemph: #c3c2b7;
  /* One meaning for colour: severity, on a single red scale. */
  --sev-blocker: #8f1f1f; --sev-major: #d03b3b; --sev-minor: #ec835a; --sev-info: #f0b9a3; --sev-unknown: #c3c2b7;
  --hl-blocker: rgba(208,59,59,0.46); --hl-major: rgba(208,59,59,0.28); --hl-minor: rgba(236,131,90,0.22);
  --hl-info: rgba(236,131,90,0.10); --hl-unknown: rgba(195,194,183,0.35); --hl-active: #8f1f1f;
  --b-full: #2a78d6; --b-partial: #1baf7a; --b-missed: #eb6834; --b-declined: #7c5cc4;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --heat-1: #fbe3dc; --heat-2: #f6c2b3; --heat-3: #ef9a85; --heat-4: #e06b57; --heat-5: #c4433a; --heat-6: #8f1f1f;
  --heat-ink-lo: #0b0b0b; --heat-ink-hi: #ffffff;
  --ins: rgba(27,175,122,0.20); --del: rgba(227,73,72,0.16); --note-bg: #fde047; --note-ink: #1f1a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-ink: #86b6ef; --focus: #6da7ec; --deemph: #52514e;
    --sev-blocker: #ffb0b0; --sev-major: #e66767; --sev-minor: #ec835a; --sev-info: #8a5a48; --sev-unknown: #52514e;
    --hl-blocker: rgba(230,103,103,0.55); --hl-major: rgba(230,103,103,0.36); --hl-minor: rgba(236,131,90,0.30);
    --hl-info: rgba(236,131,90,0.14); --hl-unknown: rgba(82,81,78,0.5); --hl-active: #ffb0b0;
    --b-full: #3987e5; --b-partial: #199e70; --b-missed: #d95926; --b-declined: #a08ae6;
    --heat-1: #3a1c18; --heat-2: #5c2620; --heat-3: #82302a; --heat-4: #b04238; --heat-5: #e06b57; --heat-6: #ffb0b0;
    --heat-ink-lo: #f0efec; --heat-ink-hi: #0b0b0b;
    --ins: rgba(25,158,112,0.30); --del: rgba(230,103,103,0.26); --note-bg: #facc15; --note-ink: #1f1a00;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-ink: #86b6ef; --focus: #6da7ec; --deemph: #52514e;
  --sev-blocker: #ffb0b0; --sev-major: #e66767; --sev-minor: #ec835a; --sev-info: #8a5a48; --sev-unknown: #52514e;
  --hl-blocker: rgba(230,103,103,0.55); --hl-major: rgba(230,103,103,0.36); --hl-minor: rgba(236,131,90,0.30);
  --hl-info: rgba(236,131,90,0.14); --hl-unknown: rgba(82,81,78,0.5); --hl-active: #ffb0b0;
  --b-full: #3987e5; --b-partial: #199e70; --b-missed: #d95926; --b-declined: #a08ae6;
  --heat-1: #3a1c18; --heat-2: #5c2620; --heat-3: #82302a; --heat-4: #b04238; --heat-5: #e06b57; --heat-6: #ffb0b0;
  --heat-ink-lo: #f0efec; --heat-ink-hi: #0b0b0b;
  --ins: rgba(25,158,112,0.30); --del: rgba(230,103,103,0.26); --note-bg: #facc15; --note-ink: #1f1a00;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--grid); padding: 18px 14px 24px; display: flex; flex-direction: column; gap: 16px; }
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 0 6px; font-weight: 650; }
.brand strong { display: block; font-size: 14px; line-height: 1.3; }
.brand span { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.nav { display: grid; gap: 2px; }
.nav button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav .n { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 400; }
.filters { display: grid; gap: 6px; }
.filters input, .filters select { width: 100%; background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.filters .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.ghost { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
.ghost:hover { background: var(--surface-2); }
.legend { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.legend .item { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; color: inherit; }
.legend .item.on { color: var(--ink); font-weight: 600; }
.toc { display: grid; gap: 1px; font-size: 12.5px; }
.toc button { background: none; border: 0; text-align: left; padding: 3px 6px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; color: var(--ink-2); }
.toc button:hover { background: var(--surface-2); color: var(--ink); }
.toc button.sub { padding-left: 18px; }
.toc .dots { display: inline-flex; gap: 2px; align-items: center; flex: none; }
.toc .dot { width: 7px; height: 7px; border-radius: 50%; }
.main { min-width: 0; padding: 0 28px 48px; }
header.top { padding: 24px 0 6px; max-width: 1200px; }
header.top h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; font-weight: 650; }
.meta { color: var(--ink-2); margin: 0; font-size: 14px; }
.scope { color: var(--ink-2); margin: 6px 0 0; max-width: 90ch; }
.notice { border: 1px solid var(--border); border-left: 4px solid var(--warning); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin: 12px 0; max-width: 1200px; }
.panel { max-width: 1200px; }
.panel[hidden] { display: none; }
.panel.wide { max-width: none; }
h2.sec { font-size: 20px; margin: 28px 0 10px; font-weight: 650; }
h3 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
/* The claim ladder: one row per claim, its rung before (hollow) and after (filled) on the ladder's scale. */
.ladder { display: grid; gap: 2px; }
.ladder-row { display: grid; grid-template-columns: minmax(120px, 32%) 1fr; gap: 10px; align-items: center; padding: 3px 4px; border-radius: 6px; }
.ladder-row:not(.ladder-head):hover, .ladder-row:focus-visible { background: var(--surface-2); }
.ladder-label { font-size: 13px; overflow-wrap: anywhere; }
.ladder-track { position: relative; display: grid; grid-template-columns: repeat(var(--rungs), 1fr); min-height: 22px; align-items: center; }
.ladder-head .ladder-track { align-items: end; }
.ladder-track .rung { font-size: 11px; line-height: 1.2; color: var(--ink-2); text-align: center; padding: 0 2px; }
.ladder-track .cell { height: 22px; border-left: 1px dashed var(--grid); }
.ladder-track .cell:last-of-type { border-right: 1px dashed var(--grid); }
.ladder-track .span { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
.ladder-track .dot { position: absolute; top: 5px; width: 12px; height: 12px; border-radius: 50%; }
.ladder-track .dot.from { background: var(--surface); border: 2px solid var(--ink-2); }
.ladder-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.ladder-key .sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
/* The reviewers' criteria, written before reading. */
.crit { width: 100%; border-collapse: collapse; font-size: 13px; }
.crit td { padding: 4px 6px; vertical-align: top; border-top: 1px solid var(--grid); }
.crit-mark { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
.crit-mark.raised { background: var(--sev-major); }
.crit-mark.checked { background: var(--good); }
.crit-mark.open { background: transparent; border: 2px solid var(--sev-unknown); }
/* The reference list, one cell per entry in list order. */
.ref-strip { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0 4px; }
.ref-cell { width: 16px; height: 16px; border-radius: 3px; display: inline-block; border: 0; padding: 0; cursor: default; }
a.ref-cell { cursor: pointer; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); margin-top: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--ink-2); font-size: 13px; }
.kpi .value { font-size: 32px; font-weight: 650; line-height: 1.15; margin: 4px 0 2px; }
.kpi .sub { color: var(--ink-2); font-size: 13px; }
.kpi.hero { grid-column: span 2; }
.kpi.go { cursor: pointer; }
.kpi.go:hover { border-color: var(--focus); }
.kpi.hero .value { font-size: 52px; }
@media (max-width: 480px) { .kpi.hero { grid-column: span 1; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; }
.chip .icon { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #0b0b0b; }
.chip .count { color: var(--ink-2); }
.st-good .icon { background: var(--good); } .st-warning .icon { background: var(--warning); }
.st-critical .icon { background: var(--critical); color: #fff; } .st-muted .icon { background: var(--grid); color: var(--ink); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 18px; padding: 0 4px; border: 1px solid var(--ink-2); border-radius: 4px; font: 700 12px/1 system-ui, "Segoe UI Symbol", "DejaVu Sans", sans-serif; letter-spacing: 0.02em; color: var(--ink); background: var(--surface); vertical-align: middle; margin-right: 3px; }
.bars { display: grid; gap: 2px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 6px; border: 0; background: none; text-align: left; width: 100%; }
button.bar-row { cursor: pointer; }
button.bar-row:hover, .bar-row.active { background: var(--surface-2); }
.bar-row.active .bar-label { font-weight: 650; }
.bar-label { color: var(--ink); font-size: 13px; display: flex; gap: 6px; align-items: center; overflow-wrap: anywhere; }
.bar-track { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.bar-fill { display: block; height: 16px; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-value { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.stack { display: flex; gap: 2px; height: 18px; flex: 1; }
.stack span { display: block; height: 100%; }
.stack span:last-child { border-radius: 0 4px 4px 0; }
.leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.leg span { display: inline-flex; gap: 6px; align-items: center; }
.empty { color: var(--ink-2); font-style: italic; margin: 6px 0; }
.note { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
tr.detail td { background: var(--surface-2); }
tr.detail[hidden] { display: none; }
.sev { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tag { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; margin: 1px 2px 1px 0; }
.link { color: var(--accent-ink); background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
blockquote { margin: 8px 0; padding: 4px 0 4px 12px; border-left: 3px solid var(--axis); white-space: pre-wrap; overflow-wrap: anywhere; }
.detail-grid { display: grid; gap: 10px; }
.detail-grid dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
.detail-grid dd { margin: 0 0 6px; overflow-wrap: anywhere; }
.said { margin: 6px 0; }
.said .who { font-size: 12px; color: var(--ink-2); display: flex; gap: 4px; align-items: center; }
.said blockquote { margin: 2px 0 0; font-size: 13px; }
details > summary { cursor: pointer; color: var(--ink-2); }
.diff { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
.diff ins { background: var(--ins); text-decoration: underline; text-decoration-thickness: 1px; }
.diff del { background: var(--del); text-decoration: line-through; }
.edit { margin: 0 0 16px; }
.edit .why { margin: 10px 0 0; line-height: 1.5; }
.edit .why > div { margin-top: 4px; }
.edit header { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
.heat td.cell { text-align: center; font-variant-numeric: tabular-nums; min-width: 44px; }
.heat th.row-head { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 500; white-space: normal; min-width: 160px; }
.heat th.reader-col { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); white-space: normal; text-align: center; min-width: 88px; vertical-align: bottom; }
.heat td.inferred { opacity: 0.5; }
.reader { display: grid; gap: 4px; }
/* The manuscript view */
.paper-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 16px; }
article.paper { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 36px; font: 16px/1.65 Georgia, "Times New Roman", serif; min-width: 0; }
article.paper h1 { font-size: 24px; line-height: 1.3; } article.paper h2 { font-size: 20px; margin-top: 32px; } article.paper h3 { font-size: 17px; }
article.paper table { border-collapse: collapse; width: 100%; font: 13px/1.45 system-ui, sans-serif; display: block; overflow-x: auto; margin: 14px 0; }
article.paper th, article.paper td { border: 1px solid var(--grid); padding: 5px 8px; text-transform: none; letter-spacing: 0; color: var(--ink); white-space: normal; }
article.paper img { max-width: 100%; height: auto; display: block; margin: 12px auto; }
article.paper code { font-size: 0.88em; background: var(--surface-2); padding: 0 3px; border-radius: 3px; }
article.paper a { color: var(--accent-ink); }
article.paper blockquote { color: var(--ink-2); white-space: normal; }
/* A problem's passage: a soft tint and an underline in its severity's colour, stronger on hover and when selected.
   Nothing is added to the text: its ID, skills and kind are in the comment beside it. */
mark.hl { --sev: var(--sev-unknown); color: inherit; background: color-mix(in srgb, var(--sev) 14%, transparent); cursor: pointer; border-radius: 2px;
  text-decoration: underline 2px var(--sev); text-underline-offset: 3px; text-decoration-skip-ink: none; }
mark.hl.s-blocker { --sev: var(--sev-blocker); background: color-mix(in srgb, var(--sev) 20%, transparent); }
mark.hl.s-major { --sev: var(--sev-major); }
mark.hl.s-minor { --sev: var(--sev-minor); background: color-mix(in srgb, var(--sev) 10%, transparent); }
mark.hl.s-info { --sev: var(--sev-minor); background: none; text-decoration-style: dotted; }
mark.hl.candidate { text-decoration-style: dashed; }
mark.hl:hover, mark.hl.active { background: color-mix(in srgb, var(--sev) 32%, transparent); }
mark.hl.active { outline: 2px solid var(--hl-active); outline-offset: 1px; }
mark.hl.off, article.paper[data-margin="history"] mark.hl { background: none; text-decoration: none; outline: 0; cursor: auto; }
aside.rail { position: relative; min-width: 0; }
.comment { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--sev-unknown); border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.45; margin-bottom: 10px; cursor: pointer; }
aside.rail .comment { position: absolute; left: 0; right: 0; }
aside.rail .comment.active { z-index: 3; box-shadow: 0 0 0 2px var(--hl-active), 0 8px 24px rgba(0,0,0,0.18); }
aside.rail .comment, aside.rail .history { transition: top 140ms ease; }
@media (prefers-reduced-motion: reduce) { aside.rail .comment, aside.rail .history { transition: none; } }
.comment.s-blocker { border-left-color: var(--sev-blocker); } .comment.s-major { border-left-color: var(--sev-major); }
.comment.s-minor { border-left-color: var(--sev-minor); } .comment.s-info { border-left-color: var(--sev-info); }
.comment.active { box-shadow: 0 0 0 2px var(--hl-active); }
.comment h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 650; line-height: 1.35; }
.comment .tags { color: var(--ink-2); font-size: 12px; margin: 0 0 4px; }
.comment p { margin: 4px 0; }
/* A comment shows its problem, severity and kind; selected, it opens to everything else. */
.comment:not(.active) .more, .history:not(.active) .more { display: none; }
.comment:not(.active) .tags { margin-bottom: 0; }
.comment .foot { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
.comment .foot a { font-size: 11.5px; }
.comment[hidden] { display: none; }
/* What sits beside the text: the problems, or the history of the revision marks. */
.margin-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0 0; }
.margin-bar .views { margin: 0; }
.margin-bar .note { margin: 0; }
.history { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; line-height: 1.45; cursor: pointer; }
.history.agent { border-left-color: var(--warning); }
aside.rail .history { position: absolute; left: 0; right: 0; }
.history.active { z-index: 3; box-shadow: 0 0 0 2px var(--focus), 0 8px 24px rgba(0,0,0,0.18); }
.history h4 { margin: 0 0 3px; font-size: 13px; font-weight: 650; }
.history ul { list-style: none; margin: 0; padding: 0; }
.history li { display: flex; justify-content: space-between; gap: 8px; }
.history li .who { font-weight: 600; }
.history li .who.agent::after { content: " (AI)"; font-weight: 400; color: var(--ink-2); }
.history li .when { color: var(--ink-2); text-align: right; }
.history .state { margin-top: 4px; color: var(--ink-2); }
.history .foot { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
.history[hidden] { display: none; }
article.paper[data-margin="history"] [data-rev] { position: relative; }
article.paper[data-margin="history"] [data-rev]::before { content: ""; position: absolute; left: -18px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--accent); opacity: 0.55; }
article.paper[data-margin="history"] [data-rev].agent::before { background: var(--warning); opacity: 0.9; }
article.paper[data-margin="history"] [data-rev].lit { background: color-mix(in srgb, var(--focus) 9%, transparent); border-radius: 4px; }
article.paper[data-margin="history"] [data-rev].lit::before { opacity: 1; width: 4px; }
.general .list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 10px; }
/* Journals */
.venues { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.venue .rank { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; margin-right: 8px; }
.venue .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 10px 0; }
.venue .facts dt { color: var(--ink-2); }
.venue .facts dd { margin: 0; }
tr.chosen td { background: var(--surface-2); }
.mini { display: inline-block; height: 8px; border-radius: 0 3px 3px 0; background: var(--accent); vertical-align: middle; margin-right: 6px; }
#tooltip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); max-width: 320px; font-size: 13px; }
#tooltip .tip-value { font-weight: 650; }
#tooltip .tip-label { color: var(--ink-2); }
footer { color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--grid); margin-top: 32px; padding-top: 12px; max-width: 1200px; }
/* The corrected version: insertions underlined on a tint, deletions struck; a routine edit already applied is dotted. */
article.paper ins { background: var(--ins); text-decoration: underline; text-decoration-thickness: 1px; cursor: pointer; }
article.paper del { background: var(--del); text-decoration: line-through; cursor: pointer; }
article.paper ins.applied, article.paper del.applied { background: none; text-decoration-style: dotted; }
article.paper[data-view="proposed"] del, article.paper[data-view="original"] ins { display: none; }
article.paper[data-view="proposed"] ins, article.paper[data-view="original"] del { background: none; text-decoration: none; cursor: auto; }
article.paper .flash { outline: 2px solid var(--focus); outline-offset: 2px; }
/* Questions for the authors are comments, never text: the passage is marked in yellow and a ? opens the question. */
article.paper .asks { box-shadow: inset 0 -0.45em 0 var(--note-bg); }
article.paper button.ask { display: inline-flex; align-items: center; justify-content: center; width: 1.25em; height: 1.25em; margin: 0 2px; padding: 0; border: 0; border-radius: 50%; background: var(--note-bg); color: var(--note-ink); font: 700 0.7em/1 system-ui, sans-serif; vertical-align: super; cursor: pointer; }
article.paper.hide-asks .asks { box-shadow: none; } article.paper.hide-asks button.ask { display: none; }
.note-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 0; }
.note-bar .swatch-note { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--note-bg); vertical-align: middle; }
.rev-item .question { display: block; margin-top: 2px; padding: 2px 6px; border-left: 3px solid var(--note-bg); }
.rev-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 16px; }
.rev-list { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; display: grid; gap: 10px; }
.rev-list details > summary { cursor: pointer; font-weight: 600; }
.rev-item { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; margin-top: 6px; color: var(--ink); font-size: 13px; }
button.rev-item { cursor: pointer; } button.rev-item:hover, .rev-item.active { border-color: var(--focus); }
.rev-item .why { color: var(--ink-2); display: block; margin-top: 2px; }
.rev-item .id { color: var(--muted); display: block; margin-top: 2px; font-size: 11px; }
.views { display: inline-flex; gap: 4px; margin: 12px 0 0; }
.views button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.flag .icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font: 700 11px/1 system-ui, sans-serif; flex: none; }
.flag.good .icon { background: var(--good); color: #fff; } .flag.warning .icon { background: var(--warning); color: #0b0b0b; }
.flag.red .icon { background: var(--critical); color: #fff; } .flag.unknown .icon { background: var(--grid); color: var(--ink); }
.flag.red { font-weight: 600; }
.ai-grid td { vertical-align: top; min-width: 120px; }
.ai-tag { display: inline-block; border: 1px solid var(--ink-2); border-radius: 4px; padding: 0 4px; font: 700 10px/16px system-ui, sans-serif; margin-left: 4px; color: var(--ink); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
/* Figures */
.figs { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.fig.wide { grid-column: 1 / -1; }
.fig.flash { outline: 2px solid var(--focus); outline-offset: 2px; }
.fig header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.fig .pics { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.fig figure { margin: 0; }
.fig img { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--grid); border-radius: 6px; cursor: zoom-in; }
.fig.wide img { cursor: zoom-out; }
.fig figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.fig h4 { font-size: 13px; margin: 12px 0 4px; }
.fig ul { margin: 0; padding-left: 18px; }
.fig li { margin-bottom: 4px; }
/* Co-authors' comments: one card per comment, the comment and its status always in view, the answer below it. */
.ca-list { display: grid; gap: 12px; }
.ca[hidden], .ca .body[hidden] { display: none; }
.ca.flash { outline: 2px solid var(--focus); outline-offset: 2px; }
.ca header { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.ca header .who { font-weight: 600; }
.ca header .ghost { margin-left: auto; padding: 2px 10px; }
.ca .on { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; overflow-wrap: anywhere; }
.ca .asked { margin: 6px 0 0; }
.ca .edit-line { margin-top: 4px; }
.ca .body { margin-top: 4px; border-top: 1px solid var(--grid); }
.ca h4 { font-size: 13px; margin: 14px 0 4px; }
.ca .thread { display: grid; gap: 6px; margin: 4px 0 0; padding-left: 12px; border-left: 2px solid var(--grid); }
.ca .reply .who { font-size: 12px; color: var(--ink-2); }
.ca .reply p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
.ca .next { border-left: 4px solid var(--warning); background: var(--surface-2); border-radius: 6px; padding: 6px 10px; margin-top: 12px; }
.ca .links { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; }
.ca-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 10px 1px 3px; font-size: 13px; font-weight: 600; background: var(--surface); }
.ca-chip .icon { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; }
.bar-row.pick { cursor: pointer; }
.bar-row.pick:hover { background: var(--surface-2); }
article.paper mark.said-here { color: inherit; background: none; }
article.paper mark.said-here.lit { background: color-mix(in srgb, var(--focus) 18%, transparent); outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 2px; }
/* To-do: one card per item the run leaves for the authors, each marked approved or redundant; the next run reads the marks. */
.td-list { display: grid; gap: 12px; }
.td[hidden], .td-group[hidden] { display: none; }
.td.flash { outline: 2px solid var(--focus); outline-offset: 2px; }
.td.approved { border-left: 4px solid var(--good); } .td.redundant { border-left: 4px solid var(--ink-2); }
.td header { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.td .what { margin: 8px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.td .ask-q { border-left: 3px solid var(--note-bg); padding: 2px 8px; margin: 6px 0 0; }
.td .diff { margin-top: 8px; }
.td .earlier { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.td-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--grid); }
.td-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-weight: 600; }
.td-btn:hover { background: var(--surface-2); }
.td-btn.approve[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #0b0b0b; }
.td-btn.redundant[aria-pressed="true"] { background: var(--ink-2); border-color: var(--ink-2); color: var(--page); }
.td-reason { flex: 1 1 220px; min-width: 0; background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
.td-reason[hidden] { display: none; }
.td .means { flex-basis: 100%; margin: 0; }
.save-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.save-bar .note { margin: 0; }
.progress { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); margin: 14px 0 0; }
.progress span { display: block; height: 100%; }
@media (max-width: 1100px) { .paper-layout, .rev-layout { grid-template-columns: 1fr; } aside.rail .comment, aside.rail .history { position: static; margin-bottom: 8px; } .rev-list { position: static; max-height: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--grid); }
  .nav { grid-auto-flow: column; overflow-x: auto; }
  .main { padding: 0 16px 40px; }
  .side .wide-only { display: none; }
  article.paper { padding: 18px 16px; }
  article.paper[data-margin="history"] [data-rev]::before { left: -10px; }
}
@media print {
  .side, #tooltip, .ghost, .save-bar, .td-btn { display: none !important; }
  .app { grid-template-columns: 1fr; }
  .panel[hidden] { display: block !important; }
  tr.detail[hidden] { display: table-row !important; }
  .paper-layout { grid-template-columns: 1fr; }
  aside.rail .comment, aside.rail .history { position: static; break-inside: avoid; }
  body { background: #fff; }
  .card, .kpi, .table-wrap { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation and filters">
    <div class="brand"><strong id="brand-title"></strong><span id="brand-meta"></span></div>
    <nav class="nav" id="nav" role="tablist" aria-orientation="vertical"></nav>
    <section><h2>Filter</h2><div class="filters" id="filters"></div></section>
    <section class="wide-only"><h2>Severity</h2><div class="legend" id="legend-sev"></div></section>
    <section class="wide-only"><h2>Found by</h2><div class="legend" id="legend-skill"></div></section>
    <section id="toc-box" class="wide-only"><h2>Manuscript sections</h2><div class="toc" id="toc"></div></section>
    <button class="ghost" id="theme" type="button" aria-label="Switch colour theme">Theme: auto</button>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
      <p class="scope" id="scope"></p>
    </header>
    <div id="notices"></div>
    <main id="app"></main>
    <footer id="footer"></footer>
  </div>
</div>
<div id="tooltip" role="tooltip" hidden></div>
<template id="paper-src">
__MANUSCRIPT_HTML__
</template>
<template id="revision-src">
__REVISION_HTML__
</template>
<script type="application/json" id="inventory">__INVENTORY_JSON__</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('inventory').textContent);
  const inv = D.inventory, S = D.summary, counts = S.counts, R = D.revision;
  const SEV = ['blocker', 'major', 'minor', 'info', 'unknown'];
  const SEV_LABEL = {blocker: 'Blocker', major: 'Major', minor: 'Minor', info: 'Optional', unknown: 'Could not be checked'};
  // A simulated reviewer's own severity words, in the same author-facing words (optional is a possible improvement).
  const CONCERN_SEV = {blocker: 'Blocker', major: 'Major', minor: 'Minor', optional: 'Optional', info: 'Optional',
                       uncertain: 'Could not be checked', unknown: 'Could not be checked'};
  const isSerious = c => c.severity === 'blocker' || c.severity === 'major';
  const STAGE = ['now', 'writing', 'journal', 'final', 'unknown'];
  const STAGE_LABEL = {now: 'Fix now: the science and the evidence', writing: 'Then the writing', journal: 'Once you have chosen the journal',
                       final: 'Before submission, once the code is final', unknown: 'Stage not set'};
  const STAGE_SHORT = {now: 'Fix now', writing: 'Writing', journal: 'Journal', final: 'Before submission', unknown: 'Not set'};
  const STATUS = {completed: ['✓', 'Completed', 'good'], reused: ['↺', 'Reused', 'good'], partial: ['◐', 'Partial', 'warning'],
                  blocked: ['✕', 'Blocked', 'critical'], not_run: ['–', 'Not run', 'muted'], in_progress: ['…', 'In progress', 'warning'],
                  unknown: ['?', 'Not recorded', 'muted']};
  const REC = {'accept': 'Accept', 'minor-revision': 'Minor revision', 'major-revision': 'Major revision', 'reject': 'Reject'};
  const MATCH = {full: 'Matched', partial: 'Partly matched', missed: 'Not caught'};
  const MISS = {'no-skill-covers': 'No skill covers it', 'skill-did-not-look': 'In a skill\'s remit, not looked at',
                'judged-differently': 'Looked at, judged differently', 'input-missing': 'Needed input the run lacked',
                'wording-preference': 'A wording preference', 'later-decision': 'A decision made after this version',
                unexplained: 'Not yet explained'};
  // Which skill found a problem is shown by its icon, never by colour; the name is in the tooltip and the legend.
  // \uFE0E asks for the plain text glyph where a symbol also has an emoji form.
  const SKILL = {'manuscript-integrity-check': ['\u2713', 'Integrity check'], 'manuscript-reference-check': ['[1]', 'Reference check'],
    'manuscript-reporting-check': ['\u2630', 'Reporting check'], 'manuscript-peer-review': ['\u2696\uFE0E', 'Simulated reviewers'],
    'manuscript-policy-fit': ['\u00A7', 'Policy fit'], 'manuscript-story': ['\u263A\uFE0E', 'Story and readers'],
    'manuscript-figures': ['\u25A3', 'Figures and tables'],
    'manuscript-journal-select': ['\u2606', 'Journal selection'], 'manuscript-journal-adapt': ['\u21C4', 'Journal adaptation'],
    'manuscript-prose-edit': ['\u00B6', 'Prose edit'], 'manuscript-deslop': ['\u2702\uFE0E', 'Deslop'], 'manuscript-improve': ['\u2699\uFE0E', 'Workflow'],
    'manuscript-reviewer-response': ['\u21A9\uFE0E', 'Reviewer response'], 'manuscript-revision-marks': ['\u270E', 'Revision marks'],
    'manuscript-mark-people': ['\u263B\uFE0E', 'People behind the marks'], 'manuscript-coauthors': ['\u275D', "Co-authors' comments"]};
  const short = s => String(s).replace(/^manuscript-/, '');
  const skillName = s => (SKILL[s] || [null, short(s)])[1];
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const release = r => /^v/i.test(String(r)) ? String(r) : `v${r}`;  // "0.5" is read as v0.5

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return e;
  }
  const store = {
    get(key) { try { return window.localStorage.getItem(key); } catch (err) { return null; } },
    set(key, value) { try { window.localStorage.setItem(key, value); } catch (err) { /* private window */ } },
  };
  const themeButton = document.getElementById('theme');
  function applyTheme(mode) {
    if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
    else delete document.documentElement.dataset.theme;
    themeButton.textContent = `Theme: ${mode}`;
    store.set('review-dashboard-theme', mode);
  }
  let theme = store.get('review-dashboard-theme') || 'auto';
  applyTheme(theme);
  themeButton.addEventListener('click', () => { theme = {auto: 'light', light: 'dark', dark: 'auto'}[theme] || 'auto'; applyTheme(theme); });

  const tip = document.getElementById('tooltip');
  function showTip(target, lines) {
    if (!lines.some(Boolean)) { tip.hidden = true; return; }
    tip.replaceChildren(...lines.filter(Boolean).map((line, i) => h('div', {class: i ? 'tip-label' : 'tip-value'}, line)));
    tip.hidden = false;
    const r = target.getBoundingClientRect();
    const x = Math.max(8, Math.min(r.left + r.width / 2 - tip.offsetWidth / 2, window.innerWidth - tip.offsetWidth - 8));
    let y = r.top - tip.offsetHeight - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = `${x}px`;
    tip.style.top = `${y}px`;
  }
  function withTip(el, lines) {
    el.addEventListener('pointerenter', () => showTip(el, typeof lines === 'function' ? lines() : lines));
    el.addEventListener('pointerleave', () => { tip.hidden = true; });
    el.addEventListener('focus', () => showTip(el, typeof lines === 'function' ? lines() : lines));
    el.addEventListener('blur', () => { tip.hidden = true; });
    return el;
  }
  const badge = skill => withTip(h('span', {class: 'badge', 'aria-label': skillName(skill)}, (SKILL[skill] || [short(skill).slice(0, 2).toUpperCase()])[0]), [skillName(skill)]);
  const badges = skills => [...new Set(skills)].map(badge);
  // The icons of the skills this run used, with their names.
  const skillLegend = () => {
    const used = new Set([...inv.findings.flatMap(f => f.skills || []), ...inv.coverage.map(c => c.skill)]);
    return h('div', {class: 'leg', 'aria-label': 'Which skill found it'}, h('span', null, 'Found by:'),
      Object.keys(SKILL).filter(k => used.has(k)).map(k => h('span', null, h('span', {class: 'badge', 'aria-hidden': 'true'}, SKILL[k][0]), SKILL[k][1])));
  };

  // Sections in manuscript order; a finding's section maps to one by its number, then by its name.
  const clean = s => String(s).replace(/[*#_`]/g, '').replace(/\s+/g, ' ').trim();
  const SECTIONS = (inv.manuscript && inv.manuscript.sections || []).map(clean);
  const OTHER = 'Other or whole manuscript';
  const numberOf = s => (clean(s).match(/^(?:section\s+)?(\d+(?:\.\d+)*)\b/i) || [])[1];
  function sectionOf(f) {
    const text = clean(f.section), num = numberOf(text);
    if (num) {
      const hit = SECTIONS.find(s => numberOf(s) === num);
      if (hit) return hit;
    }
    const lower = text.toLowerCase();
    const named = SECTIONS.filter(s => {
      const name = s.replace(/^\d+(?:\.\d+)*\.?\s*/, '').toLowerCase();
      return name.length > 3 && (lower.includes(name) || name.includes(lower));
    }).sort((a, b) => b.length - a.length);
    return named[0] || (SECTIONS.length ? OTHER : text);
  }
  const findings = inv.findings.map(f => ({...f, _section: sectionOf(f)}));
  const byId = new Map(findings.map(f => [f.id, f]));
  const refLinks = new Map(), refState = new Map();
  if (inv.reference) for (const m of inv.reference.matches) {
    refState.set(m.reference_id, m);
    for (const id of m.finding_ids) refLinks.set(id, [...(refLinks.get(id) || []), m.reference_id]);
  }
  const editsFor = id => inv.changes.filter(c => c.finding_ids.includes(id));
  const sevRank = s => SEV.indexOf(s), stageRank = s => STAGE.indexOf(s);
  const sevBadge = sev => h('span', {class: 'sev'}, h('span', {class: 'swatch', style: `background: var(--sev-${sev})`}), SEV_LABEL[sev]);
  function statusChip(skill, status, note, n) {
    const [icon, label, tone] = STATUS[status] || STATUS.unknown;
    return withTip(h('span', {class: `chip st-${tone}`, tabindex: 0}, h('span', {class: 'icon', 'aria-hidden': 'true'}, icon),
      skill ? [badge(skill), h('strong', null, skillName(skill))] : null, label,
      n != null ? h('span', {class: 'count'}, `· ${plural(n, 'problem')}`) : null), [label, note]);
  }
  // AI-policy aspects: icon, label and words; red marks work beyond one declaration (a ban, prompts or a record
  // of AI changes, a detector, declared use held against the paper). Never colour alone.
  const AI_ASPECT = {drafting: 'AI drafting', prompts: 'Prompts', records: 'Record of AI changes', detection: 'AI-text detection',
    declaration: 'Where to declare', counted: 'Declared use held against the paper', extra: 'Extra AI work'};
  const FLAG = {good: ['✓', 'No extra work'], warning: ['!', 'Some extra work'], red: ['⚑', 'Red flag'], unknown: ['?', 'Not known']};
  function flag(aspect, a, short) {
    const [icon, word] = FLAG[a.level] || FLAG.unknown;
    return withTip(h('span', {class: `flag ${a.level}`, tabindex: 0, 'aria-label': `${AI_ASPECT[aspect]}: ${word}, ${a.text}`},
      h('span', {class: 'icon', 'aria-hidden': 'true'}, icon), short ? null : h('span', null, a.text)), [`${AI_ASPECT[aspect]}: ${a.text}`, word]);
  }
  const redFlags = v => v.ai_policy ? Object.values(v.ai_policy.aspects).filter(a => a.level === 'red').length : null;
  // A finding is AI-related when the deslop stage reported it or it is about AI use, AI policy or machine-written text.
  const AI_RE = /\bAI\b|\bLLMs?\b|large language model|generative|machine-writ|\bprompts?\b|AI-use/;
  const isAi = f => f.skills.includes('manuscript-deslop') || AI_RE.test([f.summary, f.detail, f.action, f.category].join(' '));
  function barChart(rows, opts = {}) {
    const box = h('div', {class: 'bars'});
    if (!rows.length || rows.every(r => !r.count)) { box.append(h('p', {class: 'empty'}, opts.empty || 'Nothing in this selection.')); return box; }
    const max = Math.max(...rows.map(r => r.count), 1);
    for (const r of rows) {
      const pick = opts.onPick;
      const fill = h('span', {class: 'bar-fill', style: `width: calc((100% - 3.2em) * ${r.count / max}); background: ${r.color || opts.color || 'var(--accent)'}`});
      const row = h(pick ? 'button' : 'div', {class: 'bar-row' + (opts.active === r.key ? ' active' : ''), type: pick ? 'button' : null,
        'aria-pressed': pick ? String(opts.active === r.key) : null, tabindex: pick ? null : 0,

            })))));
        p.append(card('Where readers went, and where they left', h('div', {class: 'leg'}, parts.map(([, label, color]) => h('span', null, h('span', {class: 'swatch', style: `background: ${color}`}), label))),
          h('div', {class: 'bars'}, rows),
          h('div', {class: 'table-wrap heat', style: 'margin-top: 12px'}, grid),
          h('p', {class: 'note'}, `Each reader follows their own path: a skipped section is not a lost reader. ● read or skimmed, – skipped, ✕ left the paper there, blank never reached. A faded mark was not recorded for that heading itself: it comes from the subsections below it, or from the section above recorded as a whole. ${readers.length - mapped.length ? `${readers.length - mapped.length} readers in this round recorded no path and are not shown.` : ''}`)));
      }
      const odd = r => r.left && !finished(r) && /try|cite/i.test(r.next);
      p.append(h('div', {class: 'grid', style: 'margin-top: 16px'}, readers.map(r => card(r.seat, h('div', {class: 'reader'},
        ranAs(r),
        h('div', null, h('strong', null, 'Would tell a colleague: '), r.takeaway),
        h('div', null, h('strong', null, r.left ? (finished(r) ? 'Read to the end; dipped at: ' : 'Would leave at: ') : 'Attention dropped at: '), r.left && !finished(r) ? r.stopped_at : (r.dips.join(', ') || r.stopped_at)),
        r.next ? h('div', null, h('strong', null, 'Next: '), r.next) : null,
        odd(r) ? h('div', {class: 'note', style: 'color: var(--sev-major)'}, 'Inconsistent: a reader who leaves before the end cannot try or cite the work.') : null,
        !r.left ? h('div', {class: 'note'}, 'Recorded before the funnel format: where this reader would leave is unknown.') : null)))));
      p.append(h('p', {class: 'note'}, 'Simulated readers are agents given only the reading copy; they are not human participants.'));
    }
    }
    // ---------- the simulated reviewers: verdict per journal, then what they ask for, then each report ----------
    const reviewers = P.reviewers || [];
    // skeptic@codex is the skeptic's seat run on Codex: "Skeptic (on codex)".
    const seatName = seat => String(seat).replace(/@([\w-]+)$/, ' (on $1)').replace(/[-_]/g, ' ').replace(/^./, c => c.toUpperCase());
    if (P.recommendations.length) {
      const venues = [...new Set(P.recommendations.map(r => r.venue))], seats = [...new Set(P.recommendations.map(r => r.seat))];
      const vname = key => (inv.venues.find(v => v.key === key) || {}).name || key;
      p.append(h('h2', {class: 'sec', style: 'margin-top: 16px'}, 'Simulated reviewers: recommendation per journal'));
      p.append(h('div', {class: 'table-wrap'}, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Reviewer'), venues.map(v => h('th', null, vname(v))))),
        h('tbody', null, seats.map(s => h('tr', null, h('th', {scope: 'row', style: 'text-transform: none; letter-spacing: 0; color: var(--ink)'}, seatName(s)), venues.map(v => {
          const rec = P.recommendations.find(r => r.seat === s && r.venue === v);
          return h('td', null, rec ? [h('strong', null, REC[rec.recommendation]), h('div', {class: 'note', style: 'margin: 2px 0 0'}, rec.reason)] : '');
        })))))));
      p.append(h('p', {class: 'note'}, 'Recommendations are the reviewers\' own, before the authors answer. No acceptance probability is implied.'));
    }
    const concerns = reviewers.flatMap(r => r.concerns.map(c => ({...c, seat: r.seat})));
    if (concerns.length) {
      const n = pred => concerns.filter(pred).length;
      p.append(h('div', {class: 'kpis', style: 'margin-top: 16px'},
        kpi('Reviewer concerns', concerns.length, `${n(isSerious)} blocker or major · ${n(c => !isSerious(c))} minor, optional or not checked`, true),
        kpi('Upheld by the adjudication', n(c => c.verdict === 'confirmed'), `${n(c => c.verdict === 'downgraded')} downgraded · ${n(c => c.verdict === 'refuted')} refuted`),
        kpi('Fixable in the text', n(c => c.route === 'fixable-in-text'), `${n(c => c.cost === 'reanalysis')} need a reanalysis of existing data`),
        kpi('Need the authors', n(c => c.route === 'author-required'), 'a fact, a decision or new work only they can supply'),
        kpi('Answered by the defence, at least in part', n(c => c.defence === 'answered' || c.defence === 'partly answered'),
          `${n(c => c.defence === 'answered')} in full · ${n(c => c.defence === 'not answered')} not answered · ${n(c => c.defence === 'premise not supported')} premise not supported by the text`)));
      // Peer review's routes; any other route value, or none, goes in the last group.
      const ROUTE = [['fixable-in-text', 'Fixable in the text'], ['author-required', 'Needs the authors'], ['venue', 'A question for the chosen journal'],
                     ['policy', 'Ethics, consent or privacy'], ['dropped', 'Dropped by the adjudication, with the reason'], ['', 'Route not given']];
      const routeOf = c => ROUTE.some(([r]) => r && r === c.route) ? c.route : '';
      const VERDICT = {confirmed: 'upheld', downgraded: 'downgraded', refuted: 'refuted'};
      // Where an expectation a concern rests on is written (peer review's norm_source).
      const NORM = {venue: 'asked for by the journal', guideline: 'required by a reporting guideline', module: 'a question of the field\'s checklist', own: 'the reviewer\'s own expectation'};
      const normOf = c => { const m = /^\s*(venue|guideline|module|own)\s*:\s*([\s\S]*)$/i.exec(c.norm_source || ''); return m ? [m[1].toLowerCase(), m[2].trim()] : null; };
      const normTag = c => { const m = normOf(c); return m ? withTip(h('span', {class: 'tag', tabindex: 0}, `Expectation: ${NORM[m[0]]}`), ['Where the expectation comes from', m[1]]) : null; };
      const concernItem = c => h('li', {style: 'margin-bottom: 8px'},
        h('div', null, h('span', {class: 'tag'}, CONCERN_SEV[c.severity] || 'Severity not given'), c.verdict ? withTip(h('span', {class: 'tag', tabindex: 0}, VERDICT[c.verdict] || c.verdict), ['Adjudication', c.verdict_evidence || c.verdict]) : null, normTag(c),
          c.defence ? h('span', {class: 'tag'}, `Defence: ${c.defence}`) : null, c.location ? h('span', {class: 'note', style: 'margin-left: 4px'}, c.location) : null),
        h('div', null, c.concern, ' ', h('span', {class: 'note'}, `(${c.id})`)),
        c.suggestion ? h('div', null, h('strong', null, 'Suggestion: '), c.suggestion) : null,
        h('div', {class: 'note', style: 'margin: 2px 0 0'}, [c.placement ? `goes in: ${c.placement}` : null, c.cost ? `cost: ${c.cost}` : null].filter(Boolean).join(' · '),
          c.finding_ids.length ? [' · problem ', c.finding_ids.map(id => [link(id, () => openFinding(id)), ' '])] : null));
      const norms = concerns.map(normOf).filter(Boolean);
      if (norms.length) {
        const NORM_COLOR = {venue: 'var(--accent)', guideline: 'var(--b-partial)', module: 'var(--b-full)', own: 'var(--warning)'};
        p.append(h('h2', {class: 'sec'}, 'Where the reviewers\' expectations come from'),
          card(null, barChart(Object.keys(NORM).map(k => ({key: k, label: NORM[k].replace(/^./, c => c.toUpperCase()), count: norms.filter(m => m[0] === k).length, color: NORM_COLOR[k],
            hint: k === 'own' ? 'Written in neither the journal\'s pages, a reporting guideline nor the field\'s checklist: the reviewer\'s preference, kept optional unless a claim needs it' : 'Quoted or named in the concern'})), {unit: 'concern'}),
          h('p', {class: 'note'}, 'Concerns that ask for replication, more samples, an external cohort or a standard analysis say where that expectation is written. One that rests on the reviewer\'s own expectation is optional unless a claim needs it.')));
      }
      p.append(h('h2', {class: 'sec'}, 'What the reviewers suggest'),
        h('p', {class: 'note', style: 'margin-top: 0'}, 'Every concern with the reviewer\'s own suggestion (what would change their mind), grouped by who can act. Each links to the problem it became in this dashboard.'));
      for (const [route, label] of ROUTE) {
        const rank = c => ({blocker: 0, major: 1, minor: 2, optional: 3, info: 3, uncertain: 4, unknown: 4})[c.severity] ?? 5;
        const here = concerns.filter(c => routeOf(c) === route).sort((a, b) => rank(a) - rank(b));
        if (!here.length) continue;
        p.append(h('details', {class: 'card', open: route === 'fixable-in-text' || route === 'author-required' || null, style: 'margin-top: 10px'},
          h('summary', null, h('strong', null, `${label} (${here.length})`)),
          h('ul', {style: 'margin: 10px 0 0; padding-left: 18px'}, here.map(c => [h('li', {style: 'list-style: none; margin-left: -18px'}, badge('manuscript-peer-review'), ' ', h('em', null, seatName(c.seat))), concernItem(c)]))));
      }
      // What each reviewer wrote down before reading, and what became of it: raised, checked with nothing found, or neither.
      const criteriaGrid = r => {
        if (!(r.criteria || []).length) return null;
        const offs = r.concerns.filter(c => !c.criterion.length && c.off_criterion);
        return [h('h3', {style: 'font-size: 14px; margin: 10px 0 4px'}, 'What this reviewer set out to check, before reading'),
          h('table', {class: 'crit'}, h('tbody', null, r.criteria.map(cr => {
            const raised = r.concerns.filter(c => cr.concerns.includes(c.id) || c.criterion.includes(cr.id));
            const state = raised.length ? 'raised' : cr.checked ? 'checked' : 'open';
            return h('tr', null, h('td', {style: 'width: 18px'}, h('span', {class: `crit-mark ${state}`, 'aria-hidden': 'true'})),
              h('td', null, cr.text, h('div', {class: 'note', style: 'margin: 2px 0 0'},
                state === 'raised' ? `Raised: ${raised.map(c => c.id).join(', ')}` : state === 'checked' ? cr.checked.replace(/^./, c => c.toUpperCase()) : 'Not covered: no concern and no line saying what was checked.')));
          }))),
          offs.length ? h('p', {class: 'note'}, 'Found while reading, outside these criteria: ', offs.map((c, i) => [i ? '; ' : '', `${c.id} (${c.off_criterion})`])) : null];
      };
      p.append(h('h2', {class: 'sec'}, 'Each reviewer\'s report'));
      p.append(h('div', {class: 'grid'}, reviewers.map(r => card(seatName(r.seat),
        ranAs(r),
        r.summary ? h('p', {style: 'margin-top: 0'}, r.summary) : null,
        r.strengths.length ? [h('h3', {style: 'font-size: 14px; margin: 8px 0 4px'}, 'Strengths'), h('ul', {style: 'margin: 0; padding-left: 18px'}, r.strengths.map(t => h('li', null, t)))] : null,
        criteriaGrid(r),
        h('details', {style: 'margin-top: 8px'}, h('summary', null, `${plural(r.concerns.length, 'concern')}: ${r.concerns.filter(isSerious).length} blocker or major`),
          h('ul', {style: 'margin: 8px 0 0; padding-left: 18px'}, r.concerns.map(concernItem)))))));
      p.append(h('p', {class: 'note'}, 'Simulated reviewers are agents given the reading copy and the journal\'s criteria; they are not people. A defence agent then answered each concern for the authors, and an adjudicator decided what stands.'));
    }

    if (P.readers.length) {
      p = panels.readers;
      p.append(h('h2', {class: 'sec', style: 'margin-top: 16px'}, 'Simulated readers'));
      if (rounds.length > 1) {
        const pick = h('select', {'aria-label': 'Reader panel'}, rounds.map(r => h('option', {value: r, selected: r === best ? true : null},
          `${ROUND_LABEL[r] || r} (${P.readers.filter(x => roundOf(x) === r).length} readers${P.readers.some(x => roundOf(x) === r && x.path.length) ? ', reading paths' : ''})`)));
        pick.addEventListener('change', () => drawReaders(pick.value));
        p.append(h('div', {class: 'filters', style: 'max-width: 420px; margin-bottom: 12px'}, pick));
      }
      p.append(readerBox);
      drawReaders(best);
    }

  })();

  // ---------- coverage ----------
  if (panels.coverage) (function coverage() {
    const p = panels.coverage;
    p.append(h('h2', {class: 'sec', style: 'margin-top: 16px'}, 'What each skill covered'));
    p.append(h('div', {class: 'table-wrap'}, h('table', null, h('thead', null, h('tr', null, ['Skill', 'Status', 'Coverage', 'Confirmed problems', 'Evidence'].map(t => h('th', null, t)))),
      h('tbody', null, inv.coverage.map(c => h('tr', null, h('td', null, badge(c.skill), ' ', skillName(c.skill)), h('td', null, statusChip(null, c.status, c.note)),
        h('td', null, c.note), h('td', {class: 'num'}, String(S.by_skill[c.skill] || 0)), h('td', null, c.evidence.map(e => h('div', {class: 'note', style: 'margin: 0'}, e.path)))))))));
    if (inv.not_checked.length) {
      p.append(h('h2', {class: 'sec'}, 'What could not be checked'));
      p.append(h('div', {class: 'table-wrap'}, h('table', null, h('thead', null, h('tr', null, ['Skill', 'Check', 'Why', 'What it leaves open'].map(t => h('th', null, t)))),
        h('tbody', null, inv.not_checked.map(n => h('tr', null, h('td', null, badge(n.skill)), h('td', null, n.check), h('td', null, n.why), h('td', null, n.leaves_open)))))));
    }
    if (inv.signals.length) {
      p.append(h('h2', {class: 'sec'}, 'Raw signals screened'));
      p.append(h('div', {class: 'table-wrap'}, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Skill'), h('th', null, 'Check'), h('th', {class: 'num'}, 'Signals'), h('th', null, 'File'))),
        h('tbody', null, inv.signals.map(s => h('tr', null, h('td', null, badge(s.skill)), h('td', null, s.check), h('td', {class: 'num'}, String(s.count)), h('td', null, s.note)))))));
    }
    if (inv.dismissed.length || findings.some(f => f.assessment === 'dismissed')) {
      p.append(h('h2', {class: 'sec'}, `Dismissed flags (${counts.dismissed_flags})`));
      p.append(h('ul', null, inv.dismissed.map(d => h('li', null, badge(d.skill), ` ${d.summary}. `, h('span', {class: 'note'}, d.why))),
        findings.filter(f => f.assessment === 'dismissed').map(f => h('li', null, h('strong', null, f.id), `: ${f.summary}`))));
    }
    p.append(h('h2', {class: 'sec'}, 'Limits of these counts'));
    p.append(h('ul', null, [...inv.limitations,
      'Counts describe this review scope, not detection accuracy, scientific quality or publication readiness.',
      'One problem is counted once across skills; edits and problems are separate units; candidates and dismissed flags are never added to the confirmed total.',
      'Every quote and evidence excerpt was checked to occur verbatim in its file when this page was built; whether it supports the finding is the reviewers\' judgement.'].map(t => h('li', null, t))));
  })();

  document.getElementById('footer').textContent = `Built from ${plural(findings.length, 'record')} and ${plural(inv.changes.length, 'edit')} in run ${inv.run_id}. Evidence excerpts are embedded; the original files need not accompany this page. Generated ${D.generated}.`;
  let pending = null;
  window.addEventListener('resize', () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(layoutRail); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutRail);
  refresh();
  if (!openAddress()) selectTab('overview');
  requestAnimationFrame(() => requestAnimationFrame(() => { loaded = true; }));
})();
</script>
</body>
</html>
