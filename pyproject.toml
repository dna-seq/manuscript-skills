[project]
name = "manuscript-skills"
version = "0.1.0"
description = "Tests for the manuscript-skills plugin scripts (the scripts themselves run with `uv run --script`)."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "huggingface_hub>=0.34",
    "psutil>=5.9",
    "beautifulsoup4>=4.12",
    "pillow>=10",
    "filelock>=3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
