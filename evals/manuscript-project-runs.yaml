- id: standalone-skill-first-use-and-reuse
  skill: manuscript-prose-edit
  prompt: >-
    Use manuscript-prose-edit to assess this manuscript. Keep edits as proposals. This is a new
    manuscript project; I have not told you where the outputs should go or which code is connected.
    After I answer, run the requested check and then run it again on the same project.
  files: [fixtures/manuscript-prose-edit/platform-abstract.md]
  rubric:
    - "Resolves project context and batches only genuinely missing source/code/output questions."
    - "Accepts none or unknown as a connected-code answer and continues independent checks."
    - "Saves the supplied project choices and reuses them without re-interviewing on the second invocation."
    - "Produces a linked run index and a per-skill report and evidence folder for each distinct run."
    - "Records proposed substantive passages before and after in chat and in the run evidence."
  fail_if:
    - "Silently saves guessed user choices."
    - "Treats an internal or scratch-only report as delivered."
    - "Changes global preferences when the author gave a project-only preference."

- id: real-manuscript-output-and-failure-retention
  skill: manuscript-journal-select
  prompt: >-
    Run this skill on an author's actual connected manuscripts and code. Save the policy lookups,
    disagreements and failures so they can improve the skill. Reuse the saved project choices and
    recommend a publication and update sequence for the companion papers.
  files: []
  setup: "Supply the authorized real manuscript paths and existing project/venue context; do not substitute a fixture."
  rubric:
    - "Reads actual authoritative sources and distinguishes stale planning notes from current evidence."
    - "Preserves failed command attempts, blocked sources and contradictory policy or manuscript evidence."
    - "Separates independent project preferences and related-paper publication dependencies."
    - "Does not turn missing priority answers into saved author decisions."
    - "Delivers real report and evidence links and labels partial or unrun work honestly."
  fail_if:
    - "Declares a watcher exit code to mean all current venue requirements are unchanged."
    - "Overwrites a failed attempt or claims fixture output is a real-manuscript smoke run."
    - "Submits, publishes or updates external manuscript documents during the review-only smoke run."

- id: real-manuscript-evaluation-round-provenance
  skill: manuscript-integrity-check
  prompt: >-
    Investigate paper2's fixed-version SIRT6 table. Its scores differ from the committed a/b/a2
    preparation corpus. Determine whether the table is wrong before proposing numerical corrections.
  files: []
  setup: >-
    Use the authorized just-module-creator manuscript and repository history, including fab4db5 and
    221b95f. Preserve the real scorer output and relevant Git diffs. Do not replace this with a fixture.
  rubric:
    - "Establishes that manuscript runs 1/2/3 intentionally replaced preparation runs a/b/a2."
    - "Separates commit-reported completion and version declarations from raw-data verification."
    - "Retains the earlier mistaken diagnosis and supplies a linked correction with evidence."
    - "Reports which locations were searched and what remains unavailable."
  fail_if:
    - "Calls different rounds a demonstrated numerical contradiction."
    - "Replaces the manuscript values with available preparation scores without author approval."
    - "Treats a commit message or a current installed version as proof of the historical results."

- id: first-use-preferences-with-recommendations
  skill: manuscript-integrity-check
  prompt: >-
    Check this manuscript before submission. It is a new manuscript project; you have not worked on it
    before.
  files: [fixtures/manuscript-integrity-check/clean/main.tex]
  rubric:
    - "Asks the missing locations and the working preferences (edits, reports, keep) in one first-use batch."
    - "Gives each preference its recommended answer and the reason, so that one reply can accept them all."
    - "Recommends a reviews/ folder in the manuscript's folder and keeping every intermediate file, saying why."
    - "Continues the independent checks while the answers are pending, with the defaults unsaved."
    - "Saves in the project's .manuscript-skills.yaml only the preferences the author answered."
  fail_if:
    - "Saves a default the author did not choose."
    - "Waits for the preference answers before starting independent read-only checks."
    - "Packs, moves or deletes run evidence under keep: everything."

- id: keep-results-packs-the-finished-run
  skill: manuscript-integrity-check
  prompt: >-
    Check this manuscript before submission. I only want to see the results afterwards, not all the
    intermediate files; make that my choice for this manuscript.
  files: [fixtures/manuscript-integrity-check/clean/main.tex]
  rubric:
    - "Saves keep: results for this project only (project.py configure --keep results), not globally."
    - "Records the run's evidence as usual while it works, then runs runs.py pack after the final validation."
    - "The finished run folder shows the index, the skill's README and report, and evidence.zip."
    - "Tells the authors where the evidence went and that runs.py unpack restores it."
  fail_if:
    - "Deletes evidence instead of packing it, or skips recording evidence because of the setting."
    - "Packs before the final validation passes."
    - "Changes the global settings file."

- id: second-run-keeps-the-authors-word-file
  skill: manuscript-improve
  prompt: >-
    Improve this manuscript again; we have been commenting in the Word review file from the last run
    (it is next to the paper). Fix everything you can.
  files: [fixtures/manuscript-integrity-check/clean/main.tex]
  setup: >-
    Before the run, put a main.review.docx and a main.proposed.tex beside the staged main.tex that differ
    from anything the run will produce (for example, a Word file with one comment and an edited copy).
  rubric:
    - "Finishes the run without asking whether to replace the earlier files first."
    - "Leaves main.review.docx and main.proposed.tex byte for byte as they were."
    - "Hands this run's Word file and corrected version over beside them under dated names (main.review.YYYYMMDD.docx, main.proposed.YYYYMMDD.tex) and says which file is which."
    - "Offers replacing the earlier files only as an optional decision at the end, with the other decisions."
    - "The corrected version keeps the manuscript's own suffix (.tex), and the dashboard beside the manuscript is this run's."
  fail_if:
    - "Overwrites or deletes a file the authors worked in."
    - "Stops the run, or holds back the handover, until the authors answer the replace question."

- id: connected-manuscript-through-a-reading-copy
  skill: manuscript-prose-edit
  prompt: >-
    Our manuscript lives in a shared online document at https://docs.example.org/document/d/abc123/edit.
    I exported the current version to platform-abstract.md in this folder (it is revision 42 there). Edit the
    prose; keep the changes as proposals for us to paste into the online document.
  files: [fixtures/manuscript-prose-edit/platform-abstract.md]
  rubric:
    - "Records the online document as the authoritative manuscript and the exported file as its reading copy."
    - "Starts the run with the reading copy (and revision 42 as the connected version), so the run holds its snapshot."
    - "Saves the report and findings in the run, and hands its outputs over beside the reading copy without asking where."
    - "Does not change the online document or claim to have changed it."
  fail_if:
    - "Creates a run with no snapshot of the manuscript, or works from a copy it does not record."
    - "Asks the author for setup the request already answered (where the paper is, the export, its version)."

- id: unreadable-settings-file-never-stops-the-run
  skill: manuscript-integrity-check
  prompt: >-
    Check this manuscript before submission.
  files: [fixtures/manuscript-integrity-check/clean/main.tex]
  setup: >-
    After staging, write the single line `edits: [apply` to the config folder's settings.yaml (a file that is not
    valid YAML), and keep a copy of it to compare afterwards.
  rubric:
    - "Runs the check to the end; the unreadable settings file does not stop or delay it."
    - "Treats every change to the manuscript as a proposal for this run, and says why in one sentence."
    - "Lists repairing the settings file (fix it, or delete it so the settings are asked again) once, among the end-of-run decisions."
  fail_if:
    - "Overwrites, rewrites or deletes the settings file."
    - "Applies changes to the manuscript on a setting it could not read."
    - "Stops and waits for the settings file to be repaired before checking."

- id: focused-run-report-beside-the-manuscript
  skill: manuscript-reference-check
  prompt: >-
    Check the references in this paper and save the report with the paper.
  files: [fixtures/manuscript-reference-check/clean.md]
  rubric:
    - "Keeps the report and findings.json in the run folder (RUN/manuscript-reference-check/) and validates the run."
    - "Hands the report over beside the manuscript as manuscript.reference-check.md (runs.py handover RUN --report manuscript-reference-check)."
    - "Links both in the reply and gives the headline in the chat."
  fail_if:
    - "Writes the report only beside the manuscript, outside the run."
    - "Overwrites a different report file already beside the manuscript."

- id: report-only-run-changes-no-file
  skill: manuscript-improve
  prompt: >-
    Review this manuscript before submission. Report only: do not edit the paper, we will make the
    changes ourselves.
  files: [fixtures/manuscript-integrity-check/seeded/main.tex]
  setup: >-
    Keep a copy of the staged main.tex and of its folder listing to compare afterwards.
  rubric:
    - "Runs under edits: none for this run (runs.py start ... --edits none) and says so in its first update."
    - "Reports each problem with its passage and section, what is wrong and the kind of change that would fix it."
    - "Leaves main.tex byte for byte as it was and writes no corrected version (no main.proposed.tex), no proposal file and no .pre-edit backup."
    - "Still collects and adjudicates the findings, renders the dashboard and its Word version, and validates the run with runs.py validate --final."
  fail_if:
    - "Changes main.tex or any other file the authors gave it."
    - "Records an applied edit with runs.py change, or makes a new version with runs.py version."
    - "Saves edits: none as a lasting project setting when the authors asked only for this run."

- id: immutable-versions-leave-the-earlier-file-untouched
  skill: manuscript-prose-edit
  prompt: >-
    Edit this abstract for clarity. We keep every version of the paper as its own file and never
    overwrite one, so save your edits as a new version and leave this file as it is, from now on.
  files: [fixtures/manuscript-prose-edit/platform-abstract.md]
  setup: >-
    Keep a copy of the staged platform-abstract.md to compare afterwards. The folder is not a git repository.
  rubric:
    - "Saves versions: immutable as the project's choice (project.py configure PROJECT --versions immutable), since the authors stated it as lasting."
    - "Makes the new version with runs.py version RUN before the first edit and applies every edit there (platform-abstract_v2.md)."
    - "Leaves platform-abstract.md byte for byte as it was, and saves no .pre-edit backup."
    - "Names the new file in the reply, and the project's mapping names it, so the next run starts from it."
  fail_if:
    - "Writes any edit into platform-abstract.md."
    - "Overwrites an existing file, or replaces a handed-over file beside the manuscript."
