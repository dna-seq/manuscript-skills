      source: https://academic.oup.com/bioinformatics/pages/author-guidelines
      checked: '2026-10-19'
      evidence_kind: reused same-day author record; live calculator not re-operated
    open_science:
      summary: Self-contained implementation, documentation, appropriate test data
        and freely available source at stable URLs are required at submission. Archive
        the exact described version.
      source_code: required
      software_licence: open source encouraged; access to non-commercial users required
      preprints: The author's original preprint can be posted before submission; update
        its eventual published DOI. Related manuscripts (including under consideration
        elsewhere) must be disclosed in the cover letter, copied for editors, and
        distinguished. These rules allow separate companion papers; they do not require
        one paper's acceptance first.
      source: https://academic.oup.com/bioinformatics/pages/author-guidelines
      checked: '2026-10-19'
    editorial_profile:
      summary: Original Papers cover new computational molecular-biology research,
        including software involving new methods and biological databases. Real biological
        data must be used, with simulation-only work allowed only when exceptionally
        justified. The existing literature-based corpus is biological data, but one
        adjudicated variant and a mixed-build prep round give limited evidence of
        advance.
      evidence_kind: stated scope plus manuscript-specific judgement
      source: https://academic.oup.com/bioinformatics/pages/author-guidelines
      checked: '2026-10-19'
    validation_requirements:
    - applies_to:
      - software
      strength: recommended
      description: Original Papers require actual biological data (simulation-only
        work needs an exceptional justification) and new methods need comparison with
        the state of the art. The paper has real literature-based cases, but no matched
        comparative performance baseline was located. No clinical-cohort or wet-lab
