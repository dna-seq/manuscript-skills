related_manuscripts:
- manuscript: /home/antonkulaga/sources/just-dna-lite/docs/manuscript/v0.5/paper1-just-dna-lite.md
  relationship: Paper1 consumes modules, annotates genomes, computes polygenic scores
    and reports benchmark performance; paper2 authors/evaluates/shares content and
    does not process samples.
  status: EASRP 2026 entry, no proceedings; not selected, not published and not under
    review, according to October author planning.
  dependency: A citable paper1 preprint is sufficient for paper2's runtime/consumer
    references; no checked rule requires paper1 journal acceptance.
publication_sequence:
- Resolve paper2's TeX-versus-corpus result conflict and tie each table to model/host/plugin/release/attempt
  identifiers before posting it.
- Prepare one coordinated release of the shared format/compiler/enricher/registry
  contract; archive exact per-paper software and evaluation snapshots with their own
  manifests. Paper1 benchmarks and paper2 authoring corpus remain separate.
- Post paper1 first under the chosen preprint route and capture its persistent identifier.
  Its journal submission can proceed as its own paper1 ladder and author approval
  permit.
- Replace paper2's placeholder companion citation with paper1's citable preprint.
  Post paper2 when its own evidence is ready; it need not wait for paper1 acceptance.
  If arXiv is chosen for both, observe the submitter's new-submission quota and active-submission
  cap.
- Submit paper2 to the chosen paper2 journal after the preprint, with the distinct
  contribution and companion preprint disclosed. The two distinct papers can be considered
  in parallel; never submit the same manuscript concurrently to multiple journals.
- When paper2 has an identifier, update paper1's companion reference and release mapping;
  submit substantive bioRxiv changes before acceptance because its live pages disagree
  on the later boundary.
- After either journal version appears, update the corresponding preprint DOI/journal-reference
  metadata and the other paper's citation at its next permitted revision. Keep a version-specific
  preprint citation when it supports a result not retained in the journal version.
