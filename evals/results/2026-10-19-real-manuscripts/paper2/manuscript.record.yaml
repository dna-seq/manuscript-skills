venue_facts:
  bmc-bioinformatics:
    name: BMC Bioinformatics
    jif: 4.4
    jif_year: 2025
    url: https://link.springer.com/journal/12859/submission-guidelines/software-article
    ai_policy_url: https://link.springer.com/brands/bmc/editorial-policies
    writing_help: disclose_all
    extra_burden: []
    prompts: 'no'
    tracking: 'no'
    screening: integrity_signals
    disclosure_neutral: null
    checked: '2026-10-19'
    ai_policy_evidence:
      source: https://link.springer.com/brands/bmc/editorial-policies
      checked: '2026-10-19'
      summary: Live risk framework permits writing support with human oversight, verification
        and disclosure. Red-tier examples concern opaque or unverifiable outputs and
        displaced accountability. It does not state a blanket ban on AI-written Results
        or Discussion. This overrides the catalogue's older red_line interpretation
        for this run.
    disclosure_places:
    - Methods or a suitable alternative section
    disclosure_fields:
    - how AI was used
    - human oversight and verification
    - author accountability
    limits:
      abstract_words: 350
    abstract_headings:
    - Background
    - Results
    - Conclusions
    required_sections:
    - Background
    - Implementation
    - Results
    - Discussion (if appropriate)
    - Conclusions
    - Availability and requirements
    - Declarations
    submission_rules:
    - when: submission
      rule: Provide anonymisable reviewer testing and a data availability statement.
        Include the software requirements and the required declaration headings, using
        Not applicable where appropriate.
      source: https://link.springer.com/journal/12859/submission-guidelines/software-article
      checked: '2026-10-19'
    review_speed:
    - metric: submission-to-first-decision
      days: 5
      statistic: median
      population: not stated; includes editorial assessment and must not be described
        as external peer-review duration
      period: not stated
      source: https://link.springer.com/journal/12859
      checked: '2026-10-19'
      evidence_kind: official journal statistic
    publication_costs:
    - amount: 2590
      currency: EUR
      fee_year: 2026
      route: List fee before VAT/local taxes. A 20% DEAL discount is available if
        the submitting corresponding author is an eligible Rostock researcher; university
        fund can pay at most EUR 2000 gross and remaining costs need grant/decentralised
        funds. Corresponding author and paper2 funding not confirmed; no zero author
        cost assumed.
      source: https://link.springer.com/journal/12859/how-to-publish-with-us
      checked: '2026-10-19'
    open_science:
      summary: Reviewers must be able to test anonymously. Non-commercial researcher
        access required after publication; source and an open-source licence are recommended.
        A data availability statement is required.
      source_code: encouraged
      software_licence: open source recommended, not required
      data_and_artifacts: Minimal data needed to interpret and replicate results;
        access restrictions can be stated where justified.
      preprints: BMC permits any preprint server and licence; preprints are not prior
        publication. Disclose DOI/licence on submission and add the eventual publication
        reference. Potentially overlapping companion work must be declared and cited.
      source: https://link.springer.com/brands/bmc/editorial-policies
      checked: '2026-10-19'
    editorial_profile:
      summary: Software is in scope, but the journal asks for broad utility, a significant
        advance and comparison with functionally similar software. Table 1's capability
        comparison and the current mixed-build prep corpus do not yet establish a
        comparative accuracy advance.
      evidence_kind: stated criteria plus manuscript-specific judgement
      source: https://link.springer.com/journal/12859/submission-guidelines/software-article
      checked: '2026-10-19'
    validation_requirements:
    - applies_to:
      - software
      strength: recommended
      description: Software articles usually demonstrate a significant advance by
        direct comparison with related software. This is a comparison/evidence standard,
        not a requirement for wet-lab work or a newly recruited cohort. The manuscript's
        comparative performance claim still depends on reconciling its scored runs.
      source: https://link.springer.com/journal/12859/submission-guidelines/software-article
      checked: '2026-10-19'
      quote: direct comparison with available related software
    sources:
    - https://link.springer.com/journal/12859
    - https://link.springer.com/journal/12859/how-to-publish-with-us
    - https://link.springer.com/journal/12859/submission-guidelines/software-article
    - https://link.springer.com/brands/bmc/editorial-policies
    - https://www.ub.uni-rostock.de/en/support-for-researchers/open-access/publisher-discounts/
    - https://www.springernature.com/gp/open-science/oa-agreements/germany
    exempt: []
