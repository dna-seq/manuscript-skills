module:
  title: SIRT6 rs117385980 and human longevity
  description: One SIRT6 variant, two cohorts, an inverse longevity trend significant in neither.
  report_title: SIRT6 and longevity
  icon: hourglass half
  icon_set: fomantic
  color: '#6435c9'
  name: longevity_sirt6
