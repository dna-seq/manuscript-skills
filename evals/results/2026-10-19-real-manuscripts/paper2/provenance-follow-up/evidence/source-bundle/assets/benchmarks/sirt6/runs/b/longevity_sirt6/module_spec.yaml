    at: '2026-08-30'
weighting:
  scale: >-
    Minus one to plus one, curator-set, ordinal within this module only. Positive is protective, which
    is the format's convention and the opposite of an odds ratio. Magnitudes are deliberately small
    because no result behind this module reached significance at p < 0.05.
  method: >-
    Literature triage of two papers. No GWAS effect size was reused as a weight and no polygenic score
    is involved. The heterozygous row carries minus 0.2 to record the direction both cohorts trend in,
    at a magnitude meant to be nearly negligible beside a significant finding in another module. The
    reference row carries an explicit 0.0, which is a claim that this genotype changes nothing rather
    than a blank. The homozygous-alt row is left unweighted because neither source study observed that
    genotype and its direction is therefore unknown.
  note: >-
    These weights are not comparable with any other module's and nothing downstream says so at the
    point of use. A consumer that sums weights across modules will produce a number this scale does not
    support. Read the weights as a recorded direction, never as a magnitude of risk: the underlying
    p-values are 0.074 and 0.073, and both source papers call for larger cohorts before anything here
    is treated as established.
