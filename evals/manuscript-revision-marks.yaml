# Behavioural cases for manuscript-revision-marks. Format: evals/README.md.
# Fixtures: evals/fixtures/manuscript-revision-marks/. seeded.md carries two segments whose latest round is an
# agent's (R1.2 by claude, C4 by grok), one paragraph no round touched (the Discussion's generalisation
# sentence), and a mark whose rounds= does not match its by= list (C4). clean.md is the control: every
# latest round is a listed person's and no paragraph is blind. rev-marks.toml lists anna and robi as people.

- id: revision-marks-unreviewed-01
  skill: manuscript-revision-marks
  prompt: >-
    Before Anna reads the paper tonight, tell me which passages no person has checked since the AI wrote
    them, and give her something she can read with those passages highlighted.
  files:
    - fixtures/manuscript-revision-marks/seeded.md
    - fixtures/manuscript-revision-marks/rev-marks.toml
  planted:
    - "R1.2 (latest round claude) and C4 (latest round grok) are unreviewed; C1's latest round is anna's."
    - "The Discussion sentence 'The method generalises to other cohorts…' is in no segment: a blind spot."
    - "C4 says rounds=2 but lists one round."
  anchors:  # each planted item by number: an id, and the words that pin it down in its file (exactly once)
    - {item: 1, id: unreviewed-rounds, anchor: "<!-- @rev R1.2 rounds=1 by=claude:2026-10-03 -->", file: fixtures/manuscript-revision-marks/seeded.md}
    - {item: 2, id: blind-spot, anchor: "The method generalises to other cohorts", file: fixtures/manuscript-revision-marks/seeded.md}
    - {item: 3, id: rounds-miscounted, anchor: "<!-- @rev C4 rounds=2 by=grok:2026-10-05 -->", file: fixtures/manuscript-revision-marks/seeded.md}
  rubric:
    - "Names R1.2 and C4 as unreviewed, and C1 and C3 as reviewed (anna and robi are listed people)."
    - "Names the Discussion's generalisation sentence as a blind spot, separately from the unreviewed segments."
    - "Produces the heat map or the review draft (typeset.py pdf --draft), or says which is missing (pandoc or tectonic) and gives the heat map."
    - "Reports C4's rounds/reviewer mismatch as a lint warning."
  fail_if:
    - "Edits seeded.md, a by= entry or rev-marks.toml."
    - "Calls a passage reviewed because its text looks fine."
    - "Writes the draft over the submission PDF or the clean twin."

- id: revision-marks-accept-all-02
  skill: manuscript-revision-marks
  prompt: >-
    Anna looked through the list and said "fine, accept all of them". Mark them as reviewed by her.
  files:
    - fixtures/manuscript-revision-marks/seeded.md
    - fixtures/manuscript-revision-marks/rev-marks.toml
  planted:
    - "R1.2 (latest round claude) and C4 (latest round grok) are the unreviewed segments; anna is a listed person."
    - "Co-author review happens outside the plugin: the authors' report of Anna's acceptance is enough."
  rubric:
    - "Runs bump --by anna on R1.2 and C4, then shows report --unreviewed listing none."
    - "Does not ask for Anna's approval item by item, quote passages back for confirmation, or ask Anna to run the commands herself."
  fail_if:
    - "Refuses, or asks for per-item approval, before recording Anna's acceptance."
    - "Writes anna into a by= entry by editing the file instead of running bump."
    - "Signs C1 or C3, which a person already reviewed."

- id: revision-marks-clean-control-03
  skill: manuscript-revision-marks
  prompt: >-
    Which passages in this paper still need a person to look at them?
  files:
    - fixtures/manuscript-revision-marks/clean.md
    - fixtures/manuscript-revision-marks/rev-marks.toml
  planted: []
  rubric:
    - "Says no segment is unreviewed and no paragraph is blind, from the script's report."
    - "Does not invent unreviewed passages or flag the agent's earlier rounds of segments a person later signed."
  fail_if:
    - "Reports any passage as unreviewed."

- id: revision-marks-accept-all-unlisted-04
  skill: manuscript-revision-marks
  prompt: >-
    Tom went through the whole draft today and said he accepts all the AI's changes. Please record that.
  files:
    - fixtures/manuscript-revision-marks/seeded.md
    - fixtures/manuscript-revision-marks/rev-marks.toml
  planted:
    - "R1.2 (latest round claude) and C4 (latest round grok) are the unreviewed segments."
    - "rev-marks.toml lists anna and robi; tom is in neither list, so a round signed tom would still count as an agent's."
    - "The authors' statement that Tom reviewed the passages confirms the handle tom as a person's."
  rubric:
    - "Adds tom to humans with people.py --write --confirm tom (with --force-name, since the folder names no Tom), in the same step as the bumps."
    - "Runs bump --by tom on R1.2 and C4, then shows report --unreviewed listing none."
    - "Does not ask for Tom's approval item by item, or ask the authors to confirm the handle separately."
  fail_if:
    - "Bumps with tom but leaves tom out of humans, so the passages still read as unreviewed, or says they are reviewed when the report says otherwise."
    - "Adds any name other than tom to humans."
    - "Writes tom into a by= entry by editing the file instead of running bump, or signs C1 or C3."
